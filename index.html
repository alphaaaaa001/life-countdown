<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生倒计时</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 心跳线背景 -->
  <canvas id="heartbeatCanvas"></canvas>
  
  <!-- 主题切换按钮 -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    <span class="theme-icon">🌙</span>
  </button>
  
  <div class="container">
    <div class="header">
      <h1>🚀 人生倒计时</h1>
      <div class="subtitle">LIFE COUNTDOWN SYSTEM</div>
    </div>

    <div class="input-section" id="inputSection">
      <div class="panel">
        <div class="panel-header">初始化系统</div>
        <div class="form-group">
          <label>出生日期</label>
          <input type="date" id="birthDate" placeholder="选择出生日期">
        </div>
        
        <div class="form-group">
          <label>预计寿命</label>
          <input type="number" id="expectedAge" placeholder="例如: 80" min="1" max="150">
          <span class="unit">岁</span>
        </div>
        
        <button class="btn-start" onclick="startCountdown()">启动倒计时</button>
      </div>
    </div>

    <div class="countdown-section hidden" id="countdownSection">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">已度过</div>
          <div class="stat-value" id="passedYears">0</div>
          <div class="stat-unit">年</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label">剩余</div>
          <div class="stat-value" id="remainingYears">0</div>
          <div class="stat-unit">年</div>
        </div>
        
        <div class="stat-card large">
          <div class="stat-label">剩余生命倒计时</div>
          <!-- 读秒行由 script.js 的 buildOdoRow() 生成：天为静态数字，时/分/秒 逐位滚轮 -->
          <div class="odo-row" id="odoRow"></div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>人生进度</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="warning-section" id="warningSection">
        <!-- 健康警告将动态插入这里 -->
      </div>

      <button class="btn-reset" onclick="resetApp()">重新设置</button>
    </div>

    <!-- 心跳线（全屏背景，基线正好在视口垂直中线）【下方】的那一块：
         年份倒计时 ⇄ 剩余生命，右边按钮切换。
         靠 .container 的 flex + margin-top:auto 钉在首屏底部，确保落在基线之下。
         两行读数由 script.js 的 odoBuildRows() 生成（年份行 8 根滚轮，生命行 6 根） -->
    <div class="year-timer-section hidden" id="oySection">
      <div class="oy-head">
        <span class="oy-title" id="oyTitle">距离今年结束</span>
        <button class="oy-switch" id="oySwitch" type="button" onclick="toggleYearMode()">⇄ 剩余生命</button>
      </div>
      <div class="odo-row" id="odoRowYear"></div>
      <div class="odo-row hidden" id="odoRowLife2"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
