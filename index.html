<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生倒计时</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 心跳线背景 -->
  <canvas id="heartbeatCanvas"></canvas>
  
  <!-- 主题切换按钮 -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    <span class="theme-icon">🌙</span>
  </button>

  <!-- 视图切换：生命倒计时 ⇄ 年份倒计时。和主题按钮同一条右边界，竖排在它正下方。
       启动倒计时之后才出现（初始化那一屏没有可切的东西） -->
  <button class="view-toggle hidden" id="viewToggle" onclick="toggleYearView()"
          title="切换到年份倒计时">
    <span class="view-icon" id="viewIcon">📅</span>
  </button>

  <div class="container">
    <div class="header">
      <h1>🚀 人生倒计时</h1>
      <div class="subtitle">LIFE COUNTDOWN SYSTEM</div>
    </div>

    <div class="input-section" id="inputSection">
      <div class="panel">
        <div class="panel-header">初始化系统</div>
        <div class="form-group">
          <label>出生日期</label>
          <input type="date" id="birthDate" placeholder="选择出生日期">
        </div>
        
        <div class="form-group">
          <label>预计寿命</label>
          <input type="number" id="expectedAge" placeholder="例如: 80" min="1" max="150">
          <span class="unit">岁</span>
        </div>
        
        <button class="btn-start" onclick="startCountdown()">启动倒计时</button>
      </div>
    </div>

    <div class="countdown-section hidden" id="countdownSection">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">已度过</div>
          <div class="stat-value" id="passedYears">0</div>
          <div class="stat-unit">年</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-label">剩余</div>
          <div class="stat-value" id="remainingYears">0</div>
          <div class="stat-unit">年</div>
        </div>
        
        <div class="stat-card large">
          <div class="stat-label">剩余生命倒计时</div>
          <!-- 读秒行由 script.js 的 buildOdoRow() 生成：天为静态数字，时/分/秒 逐位滚轮 -->
          <div class="odo-row" id="odoRow"></div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>人生进度</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="warning-section" id="warningSection">
        <!-- 健康警告将动态插入这里 -->
      </div>

      <button class="btn-reset" onclick="resetApp()">重新设置</button>
    </div>

    <!-- 年份倒计时「页」：和生命页像两个页面 —— 切过来时上面那些卡片整体收起，
         只剩这张大卡 + 今年进度 + 重新设置。
         位置靠 .container 的 flex + margin-top:auto 钉在首屏底部 ⇒ 落在心跳基线
         （全屏背景、基线正好在视口垂直中线）下方 -->
    <div class="countdown-section hidden" id="yearSection">
      <div class="stats-grid">
        <div class="stat-card large">
          <div class="stat-label">距离今年结束</div>
          <!-- 4 位小时 + 时/分/秒，由 script.js 的 odoBuildRows() 生成（8 根滚轮） -->
          <div class="odo-row" id="odoRowYear"></div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>今年进度</span>
          <span id="yearPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="yearFill"></div>
        </div>
      </div>

      <button class="btn-reset" onclick="resetApp()">重新设置</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
